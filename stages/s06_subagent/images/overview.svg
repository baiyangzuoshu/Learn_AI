<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img"
  aria-labelledby="title desc">
  <title id="title">06 Subagent 课程图</title>
  <desc id="desc">从 主上下文 到 结论返回 的 Subagent Harness 执行链。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fbff" />
      <stop offset="1" stop-color="#eef3f8" />
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#00838F" />
    </marker>
    <style>
    .title {
      font: 700 26px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      fill: #102a43;
    }
    .subtitle {
      font: 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      fill: #52606d;
    }
    .box-title {
      font: 700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      fill: #102a43;
    }
    .box-note {
      font: 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      fill: #7b8794;
    }
    .number {
      font: 700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      fill: #ffffff;
    }
    .callout {
      font: 600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      fill: #243b53;
    }
    </style>
  </defs>
  <rect width="960" height="420" rx="22" fill="url(#bg)" />
  <text x="48" y="52" class="title">06 · Subagent</text>
  <text x="48" y="80"
    class="subtitle">基础 Harness · 模型负责决策，Harness 负责边界、执行与证据</text>
  <line x1="48" y1="104" x2="912" y2="104" stroke="#d9e2ec" />
  <path d="M 232 201 H 262" stroke="#00838F" stroke-width="3" marker-end="url(#arrow)" />
  <path d="M 452 201 H 482" stroke="#00838F" stroke-width="3" marker-end="url(#arrow)" />
  <path d="M 672 201 H 702" stroke="#00838F" stroke-width="3" marker-end="url(#arrow)" />
  <g transform="translate(48,142)">
    <rect width="180" height="118" rx="14" fill="#ffffff" stroke="#00838F" stroke-width="2" />
    <circle cx="28" cy="28" r="16" fill="#00838F" />
    <text x="28" y="33" text-anchor="middle" class="number">1</text>
    <text x="20" y="66" class="box-title">主上下文</text>
    <text x="20" y="90" class="box-note">输入 / 观察</text>
  </g>
  <g transform="translate(268,142)">
    <rect width="180" height="118" rx="14" fill="#ffffff" stroke="#00838F" stroke-width="2" />
    <circle cx="28" cy="28" r="16" fill="#00838F" />
    <text x="28" y="33" text-anchor="middle" class="number">2</text>
    <text x="20" y="66" class="box-title">聚焦任务</text>
    <text x="20" y="90" class="box-note">Harness 边界</text>
  </g>
  <g transform="translate(488,142)">
    <rect width="180" height="118" rx="14" fill="#ffffff" stroke="#00838F" stroke-width="2" />
    <circle cx="28" cy="28" r="16" fill="#00838F" />
    <text x="28" y="33" text-anchor="middle" class="number">3</text>
    <text x="20" y="66" class="box-title">隔离 Loop</text>
    <text x="20" y="90" class="box-note">Harness 边界</text>
  </g>
  <g transform="translate(708,142)">
    <rect width="180" height="118" rx="14" fill="#ffffff" stroke="#00838F" stroke-width="2" />
    <circle cx="28" cy="28" r="16" fill="#00838F" />
    <text x="28" y="33" text-anchor="middle" class="number">4</text>
    <text x="20" y="66" class="box-title">结论返回</text>
    <text x="20" y="90" class="box-note">证据 / 状态</text>
  </g>
  <rect x="48" y="326" width="864" height="54" rx="12" fill="#00838F" opacity="0.12" />
  <text x="72" y="359" class="callout">观察主线：主上下文 → Harness 边界 → 结论返回</text>
</svg>
